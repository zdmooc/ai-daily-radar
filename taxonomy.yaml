# Taxonomie fixe des thèmes du radar.
# Sans LLM, un thème est attribué quand un mot-clé apparaît dans le titre ou le
# résumé (insensible à la casse, mots entiers). Avec un LLM, le modèle choisit
# parmi ces mêmes identifiants : la liste reste la référence unique.

tags:
